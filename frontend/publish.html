<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布失物信息 - 失物招领平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #f4f7fc;
      color: #333;
      line-height: 1.6;
    }
    header {
      background: #1976d2;
      color: #fff;
      padding: 1rem 5%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 600;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 12px;
      transition: all 0.25s;
    }
    nav a:hover {
      color: #bbdefb;
    }
    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 10px rgba(25,118,210,0.08);
    }
    h2 {
      color: #1976d2;
      margin-bottom: 24px;
      text-align: center;
    }
    .form-item {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: 0.25s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .radio-group{
      display:flex;
      gap:24px;
    }
    .radio-item{
      display:flex;
      align-items:center;
      gap:6px;
    }
    input[type="radio"]{
      width:auto;
      accent-color:#1976d2;
    }
    .upload-area{
      border:2px dashed #ccc;
      border-radius:8px;
      padding:24px;
      text-align:center;
      cursor:pointer;
      transition:0.25s;
    }
    .upload-area:hover{
      border-color:#1976d2;
      background:#f0f7ff;
    }
    #img-preview{
      max-width:100%;
      margin-top:12px;
      border-radius:8px;
      display:none;
    }
    .btn-submit{
      width:100%;
      padding:12px;
      background:#1976d2;
      color:white;
      border:none;
      border-radius:8px;
      font-size:1rem;
      cursor:pointer;
      transition:0.25s;
      box-shadow:0 2px 6px rgba(25,118,210,0.18);
    }
    .btn-submit:hover{
      background:#1565c0;
    }
    footer {
      background:#1976d2;
      color:#fff;
      text-align:center;
      padding:16px;
      margin-top:40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-wrap">
      <div class="logo">失物招领平台</div>
      <nav>
        <a href="index.html">首页列表</a>
        <a href="publish.html">发布信息</a>
        <a href="audit.html">审核管理</a>
        <a href="login.html">登录</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="form-card">
      <h2>发布失物招领信息</h2>
      <form id="publishForm">
        <div class="form-item">
          <label>信息类型</label>
          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" name="type" id="find" value="捡到物品" checked>
              <label for="find">捡到物品</label>
            </div>
            <div class="radio-item">
              <input type="radio" name="type" id="lost" value="寻找物品">
              <label for="lost">寻找物品</label>
            </div>
          </div>
        </div>

        <div class="form-item">
          <label>物品名称</label>
          <input type="text" id="title" placeholder="请填写物品名称">
        </div>

        <div class="form-item">
          <label>留言描述（详细说明物品特征、地点时间）</label>
          <textarea id="desc" placeholder="例如：在哪捡到/丢失，物品颜色、特征等详细信息"></textarea>
        </div>

        <div class="form-item">
          <label>联系方式</label>
          <input type="text" id="contact" placeholder="填写手机号/QQ，方便联系">
        </div>

        <div class="form-item">
          <label>上传物品图片（支持AI识别填充）</label>
          <div class="upload-area" id="uploadBox">
            <p>点击上传图片，AI自动识别物品信息</p>
            <input type="file" id="imgFile" accept="image/*" hidden>
          </div>
          <img id="img-preview" alt="图片预览">
        </div>

        <button type="submit" class="btn-submit">提交发布（等待审核）</button>
      </form>
    </div>
  </div>

  <footer>
    <p>失物招领平台 © 2026 课程项目</p>
  </footer>

  
  <script src="app.js"></script>
</body>
</html>
