<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>失物招领 - 物品列表</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #f4f7fc;
      color: #333;
      line-height: 1.6;
    }
    /* 导航栏蓝色统一 */
    header {
      background: #1976d2;
      color: #fff;
      padding: 1rem 5%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 600;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 12px;
      transition: all 0.25s;
    }
    nav a:hover {
      color: #bbdefb;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .search-filter-area {
      display: flex;
      flex-wrap: wrap;
      gap:12px;
      margin-bottom:24px;
      align-items:center;
    }
    #search-input{
      padding:9px 14px;
      border:1px solid #ddd;
      border-radius:8px;
      width:260px;
      font-size:0.95rem;
    }
    .filter-btn{
      padding:9px 16px;
      border:none;
      background:#1976d2;
      color:#fff;
      border-radius:8px;
      cursor:pointer;
      transition:0.25s;
    }
    .filter-btn:hover{
      background:#1565c0;
    }
    .card-wrap{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
      gap:20px;
    }
    .item-card{
      background:#fff;
      border-radius:12px;
      padding:20px;
      box-shadow:0 2px 10px rgba(25,118,210,0.08);
      transition:0.3s;
      position:relative;
    }
    .item-card:hover{
      box-shadow:0 4px 16px rgba(25,118,210,0.12);
    }
    /* 状态标签样式 和审核页面保持一致 */
    .status-tag {
      position:absolute;
      top:12px;
      left:12px;
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .pending {
      background:#e3f2fd;
      color:#1976d2;
    }
    .pass {
      background:#e8f5e9;
      color:#2e7d32;
    }
    .reject {
      background:#ffebee;
      color:#c62828;
    }
    .item-card h3{
      margin-top:28px;
      margin-bottom:8px;
      color:#222;
    }
    .item-desc{
      color:#666;
      font-size:0.95rem;
      margin-bottom:10px;
    }
    .item-type{
      color:#1976d2;
      font-weight:500;
    }
    footer {
      background:#1976d2;
      color:#fff;
      text-align:center;
      padding:16px;
      margin-top:40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-wrap">
      <div class="logo">失物招领平台</div>
      <nav>
        <a href="index.html">首页列表</a>
        <a href="publish.html">发布信息</a>
        <a href="audit.html">审核管理</a>
        <a href="login.html">登录</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="search-filter-area">
      <input type="text" id="search-input" placeholder="搜索物品名称...">
      <button class="filter-btn" onclick="filterItems()">筛选</button>
    </div>
    <div class="card-wrap" id="cardContainer">
      <!-- 物品卡片JS渲染 -->
    </div>
  </div>

  <footer>
    <p>失物招领平台 © 2026 课程项目</p>
  </footer>

  
  <script src="app.js"></script>
</body>
</html>
