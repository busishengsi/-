<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>失物招领平台 - 首页</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", sans-serif;
    }
    body {
      background-color: #f4f7fc;
      color: #333;
      line-height: 1.6;
    }
    header {
      background: #1976d2;
      color: #fff;
      padding: 1rem 5%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .nav-wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.4rem;
      font-weight: 600;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 12px;
      transition: all 0.25s;
    }
    nav a:hover {
      color: #bbdefb;
    }
    .banner{
      background: linear-gradient(135deg,#1976d2,#42a5f5);
      color:#fff;
      padding:50px 20px;
      text-align:center;
      margin-bottom:36px;
    }
    .banner h1{
      font-size:2rem;
      margin-bottom:12px;
    }
    .banner p{
      font-size:1.05rem;
      opacity:0.95;
    }
    .container{
      max-width:1100px;
      margin:0 auto;
      padding:0 20px;
    }
    .upload-card{
      background:#fff;
      border-radius:12px;
      padding:30px;
      box-shadow:0 2px 10px rgba(25,118,210,0.08);
      margin-bottom:40px;
    }
    .upload-card h2{
      color:#1976d2;
      text-align:center;
      margin-bottom:20px;
      font-size:1.3rem;
    }
    .upload-area{
      border:2px dashed #ccc;
      border-radius:8px;
      padding:24px;
      text-align:center;
      cursor:pointer;
      transition:0.25s;
    }
    .upload-area:hover{
      border-color:#1976d2;
      background:#f0f7ff;
    }
    #imgFile{
      display:none;
    }
    #img-preview{
      max-width:100%;
      margin-top:16px;
      border-radius:8px;
      display:none;
    }
    .btn-ai{
      width:100%;
      margin-top:16px;
      padding:12px;
      background:#1976d2;
      color:white;
      border:none;
      border-radius:8px;
      font-size:1rem;
      cursor:pointer;
      transition:0.25s;
      box-shadow:0 2px 6px rgba(25,118,210,0.18);
    }
    .btn-ai:hover{
      background:#1565c0;
    }
    .section-title{
      color:#1976d2;
      font-size:1.3rem;
      margin-bottom:20px;
    }
    .card-wrap{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
      gap:20px;
      margin-bottom:40px;
    }
    .item-card{
      background:#fff;
      border-radius:12px;
      padding:20px;
      box-shadow:0 2px 10px rgba(25,118,210,0.08);
      transition:0.3s;
      position:relative;
    }
    .item-card:hover{
      box-shadow:0 4px 16px rgba(25,118,210,0.12);
      transform: translateY(-4px);
    }
    .status-tag {
      position:absolute;
      top:12px;
      left:12px;
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .pending {
      background:#e3f2fd;
      color:#1976d2;
    }
    .pass {
      background:#e8f5e9;
      color:#2e7d32;
    }
    .reject {
      background:#ffebee;
      color:#c62828;
    }
    .item-card h3{
      margin-top:28px;
      margin-bottom:8px;
      color:#222;
    }
    .item-category{
      color:#7b1fa2;
      font-size:0.9rem;
      margin-bottom:6px;
    }
    .item-desc{
      color:#666;
      font-size:0.95rem;
      margin-bottom:10px;
    }
    .item-contact{
      color:#1976d2;
      font-size:0.95rem;
      margin-bottom:8px;
    }
    .item-type{
      color:#1976d2;
      font-weight:500;
    }
    footer {
      background:#1976d2;
      color:#fff;
      text-align:center;
      padding:16px;
      margin-top:40px;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-wrap">
      <div class="logo">失物招领平台</div>
      <nav>
        <a href="index.html">首页</a>
        <a href="list.html">物品列表</a>
        <a href="publish.html">发布信息</a>
        <a href="audit.html">审核管理</a>
        <a href="login.html">登录</a>
      </nav>
    </div>
  </header>

  <div class="banner">
    <h1>校园失物招领平台</h1>
    <p>上传物品照片，AI快速识别，帮你找回遗失物品</p>
  </div>

  <div class="container">
    <div class="upload-card">
      <h2>📷 AI物品识别</h2>
      <div class="upload-area" id="uploadBox">
        <p>点击上传物品图片，AI自动识别物品信息</p>
        <input type="file" id="imgFile" accept="image/*">
      </div>
      <img id="img-preview" alt="图片预览">
      <button class="btn-ai" id="aiBtn">AI识别物品</button>
    </div>

    <h2 class="section-title">🔥 最新失物信息</h2>
    <div class="card-wrap" id="cardContainer">
      <!-- 卡片JS渲染 -->
    </div>
  </div>

  <footer>
    <p>失物招领平台 © 2026 课程项目</p>
  </footer>

  
  <script src="app.js"></script>
</body>
</html>
